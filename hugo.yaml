baseURL: "https://csirt.global/"
title: "CSIRT.global"
locale: "en"

# English stays at the site root so existing URLs such as
# /cases/CG-2024-00001/ keep working. Other languages get a prefix.
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

# Minimum Hugo this site is known to build with. Keep in step with .hugo_version.
module:
  hugoVersion:
    min: "0.165.0"

languages:
  en:
    label: "English"
    direction: "ltr"
    weight: 1
  nl:
    label: "Nederlands"
    weight: 2
  de:
    label: "Deutsch"
    weight: 3
  fr:
    label: "Français"
    weight: 4
  es:
    label: "Español"
    weight: 5
  # The key is the URL prefix and stays lowercase: /pt-br/, /zh/.
  pt-br:
    label: "Português"
    weight: 6
  zh:
    label: "简体中文"
    weight: 7

# Translations are authored, never machine-guessed at request time.
# A page with no translation must be visibly absent, not silently English.
disableLanguages: []

markup:
  goldmark:
    renderer:
      unsafe: true          # the ANBI block and case bodies contain real HTML
  highlight:
    noClasses: false

# GitHub Pages URLs are case-sensitive and /cases/CG-2024-00001/ is externally
# citable, so Hugo must not lowercase paths.
disablePathToLower: true

enableRobotsTXT: true
enableGitInfo: false

# Keep Hugo from publishing things nobody asked for.
disableKinds: ["taxonomy", "term"]

outputs:
  home: ["HTML"]
  section: ["HTML"]
  page: ["HTML"]

params:
  # The one hostname that is the real site. Everything else — a staging
  # deployment, a fork's Pages URL, a local build — marks itself as not
  # production: noindex, robots disallow, and a banner on every page.
  productionHost: "csirt.global"

  # BCP 47 tags for the markup. Separate from the language key because the key
  # is the URL prefix and stays lowercase, while the tag is cased and carries
  # more: "zh" alone does not say whether the text is Simplified or Traditional,
  # and a reader whose browser prefers one gets little help from the other.
  # Only languages whose tag differs from their key need an entry.
  languageTags:
    pt-br: "pt-BR"
    zh: "zh-Hans"

  # The short code in the language switcher. "PT-BR" is a mouthful in a chip
  # that is otherwise two letters wide.
  languageCodes:
    pt-br: "br"
  # The language everything is written in first. Pages in any other language are
  # translations, and say so until a native speaker signs them off.
  sourceLanguage: "en"
  description: "CSIRT.global is a global, volunteer-led, not-for-profit organization, aiming to make the world more secure by going after vulnerabilities no-one else cares for."
  ogImage: "/android-chrome-512x512.png"
