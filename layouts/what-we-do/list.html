{{ define "main" }}
{{ partial "page-head.html" (dict "title" .Title) }}
<div class="mx-auto max-w-6xl px-5 sm:px-8 py-12 sm:py-16">
  <div class="prose-body max-w-2xl">{{ .Content }}</div>
  <ul class="mt-10 grid gap-px bg-ink-line sm:grid-cols-3 rounded-brand overflow-hidden">
    {{- range .Pages.ByWeight }}
    <li><a href="{{ .RelPermalink }}" class="group block bg-ink p-7 h-full hover:bg-ink-raised transition-colors">
      <h2 class="t-display text-xl text-text-strong group-hover:text-signal transition-colors">{{ .Title }}</h2>
      <p class="mt-3 text-[0.9375rem] leading-relaxed text-muted">{{ .Params.summary }}</p>
      <span class="t-mono mt-5 inline-block text-signal">{{ i18n "read_more" }} &rarr;</span>
    </a></li>
    {{- end }}
  </ul>
</div>
{{ end }}
