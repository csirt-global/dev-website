# The team, defined once.
#
# On the current site each person is a hand-pasted ~33-line HTML card with an
# inlined LinkedIn SVG, repeated 16 times across 3 pages in 3 inconsistent
# schemas (the NGO project page has no `role` field at all). Adding someone
# means copying a card and hoping. Here a person is a few lines of YAML.
#
# `role` is an i18n key, not literal text. Job titles are deliberately not
# translated: they are defined once in i18n/en.yaml and every language falls
# back to it, so a named colleague is not assigned a grammatical gender by a
# translator. Group names above them do translate. Names and photos are
# language-neutral.
#
# `social` entries are {kind, url}. Dead placeholder links are simply omitted:
# Victor confirmed on 2026-08-25 that "useless icons can be removed", which is
# why Marielle and Juliette have no X entry (they had href="#" in production).

groups:
  - id: supervisory
    label: group_supervisory
    intro: team_intro_supervisory
    members:
      - name: "Michiel Prins"
        role: role_cofounder
        photo: images/michiel.jpg
        social:
          - { kind: x, url: "https://twitter.com/michielprins" }
          - { kind: linkedin, url: "https://www.linkedin.com/in/michiel3/" }

