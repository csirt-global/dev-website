# Facts a suspicious recipient can check independently.
#
# This is the site's signature element. Someone who just received an unexpected
# email saying their system is vulnerable needs to establish, in seconds, that
# we are a real registered foundation and not a phishing attempt. Every row is
# something they can verify on a third-party source, not a claim we make.
